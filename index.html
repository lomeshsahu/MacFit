<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mac Fitness — Client Prototype</title>
<link rel="icon" href="assets/favicon.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#070808;--surface:#101212;--surface2:#151817;--line:#292d2b;--muted:#969d99;--lime:#d9ff2f;--text:#f5f7f4;--danger:#ff6b6b;--amber:#ffd166;--max:1380px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.container{width:min(90%,var(--max));margin:auto}
header{height:78px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;background:#070808ee;backdrop-filter:blur(14px)}.navrow{height:100%;display:flex;align-items:center;justify-content:space-between}.logo{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:1px;cursor:pointer}.mark{width:37px;height:37px;background:var(--lime);color:#070808;display:grid;place-items:center;font:900 28px 'Barlow Condensed';transform:skew(-8deg)}.logo em{font-style:normal;color:var(--lime)}nav{display:flex;align-items:center;gap:4px}nav button{background:none;border:0;color:#9da29f;padding:10px 12px;border-radius:6px}nav button:hover,nav button.active{background:#171a19;color:white}.adminBtn{border:1px solid var(--line)!important;color:white!important;margin-left:7px}.hamb{display:none;background:none;border:0;color:white;font-size:24px}
.hero{min-height:650px;display:grid;grid-template-columns:1.08fr .92fr;gap:6%;align-items:center;padding:55px 0}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--lime);margin-bottom:15px}.hero h1,h2{font:900 clamp(60px,8vw,112px)/.86 'Barlow Condensed';text-transform:uppercase;letter-spacing:-2px;margin:0}.hero h1 span,h2 span{color:var(--lime)}p{color:var(--muted);line-height:1.7}.hero p{font-size:18px;max-width:590px}.actions{display:flex;gap:10px;margin-top:27px}.primary,.secondary{border-radius:6px;padding:13px 18px;font-weight:800;border:1px solid transparent}.primary{background:var(--lime);color:#080909}.secondary{background:transparent;border-color:#444;color:white}.heroPhoto{height:510px;position:relative;overflow:hidden}.heroPhoto img{width:100%;height:100%;object-fit:cover}.heroCard{position:absolute;left:-25px;bottom:25px;background:var(--lime);color:#080909;padding:16px 20px;font-weight:900}.heroCard small{display:block;font-size:9px;letter-spacing:1px}
.stats{border-block:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:26px 0}.stats div{border-right:1px solid var(--line);padding-left:25px}.stats div:first-child{padding-left:0}.stats div:last-child{border:0}.stats b{display:block;font:800 38px 'Barlow Condensed'}.stats small{font-size:10px;color:#777;letter-spacing:1px;text-transform:uppercase}
.section{padding:95px 0}.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:20px}.section h2{font-size:76px}.featureGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);margin-top:55px}.feature{background:var(--bg);padding:33px;min-height:220px}.feature .num{font:40px 'Barlow Condensed';color:#555}.feature h3{font-size:20px}
.cta{background:var(--lime);color:#080909;padding:48px 5%;display:flex;justify-content:space-between;align-items:center;margin-bottom:80px}.cta .eyebrow{color:#3a4500}.cta h2{font-size:64px}.cta h2 span{color:#080909}.cta .primary{background:#080909;color:white}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:45px}.photo{height:285px;position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;transition:.4s}.photo:hover img{transform:scale(1.06)}.caption{position:absolute;left:0;right:0;bottom:0;padding:50px 18px 16px;background:linear-gradient(transparent,#000e)}.caption b{display:block}.caption small{color:var(--lime);letter-spacing:1px}.aiGif{background:radial-gradient(circle,#37420d,#111);display:grid;place-items:center}.orb{width:150px;height:150px;border:2px solid var(--lime);border-radius:50%;animation:pulse 2s infinite;position:relative}.orb:after{content:"M";position:absolute;inset:0;display:grid;place-items:center;font:900 65px 'Barlow Condensed';color:var(--lime)}@keyframes pulse{50%{transform:scale(1.25);opacity:.25}}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin-top:45px}.plan{border:1px solid var(--line);padding:30px;position:relative}.plan.featured{border-color:var(--lime);background:#11150a}.badge{position:absolute;right:0;top:0;background:var(--lime);color:#080909;padding:6px 9px;font-size:9px;font-weight:900}.price{font:800 55px 'Barlow Condensed'}.price small{font:12px Inter;color:#777}.plan ul{padding:0;list-style:none;color:#bbb;line-height:2.4}.plan li:before{content:'✓';color:var(--lime);font-weight:900;margin-right:9px}.plan .primary{width:100%}
.profileGrid,.supportGrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:40px}.panel{background:var(--surface);border:1px solid var(--line);padding:30px}.avatar{width:90px;height:90px;border-radius:50%;background:var(--lime);color:#080909;display:grid;place-items:center;font-size:40px;font-weight:900;margin:auto}.profile{text-align:center}.field{margin-top:15px;text-align:left}.field label{font-size:10px;color:#818783;text-transform:uppercase;letter-spacing:1px}.field input,.field textarea,.field select,.login input,.search{display:block;width:100%;margin-top:6px;background:#090b0a;border:1px solid #303432;color:white;border-radius:5px;padding:12px;outline:none}.field textarea{min-height:130px;resize:vertical}.memberMeta{border-top:1px solid var(--line);margin-top:25px;padding-top:20px;display:grid;grid-template-columns:1fr 1fr;text-align:left;gap:15px}.memberMeta span{display:block;color:#777;font-size:10px}.memberMeta b{display:block;margin-top:4px}.supportItem{padding:18px 0;border-bottom:1px solid var(--line)}.supportItem b{display:block}.supportItem span{color:#888;font-size:13px}
.login{min-height:620px;display:grid;place-items:center}.loginBox{width:min(440px,100%);text-align:center}.loginBox form{display:grid;gap:10px;margin-top:20px}.notice{font-size:11px;border:1px solid #5d501d;background:#201c0b;color:#d9c77d;padding:12px;text-align:left;margin-top:15px}.dashboardTop{display:flex;justify-content:space-between;align-items:end}.dashCards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:35px 0}.metric{background:var(--surface);border:1px solid var(--line);padding:20px}.metric b{display:block;font-size:30px}.metric small{color:#777}.metric.lime{border-color:#566600}.toolbar{display:flex;gap:10px;margin-bottom:15px}.toolbar .search{margin:0}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:780px}th,td{text-align:left;padding:14px;border-bottom:1px solid var(--line);font-size:12px}th{font-size:9px;color:#777;letter-spacing:1px;text-transform:uppercase}.member small{display:block;color:#777;margin-top:3px}.active{color:var(--lime);font-weight:800}.expired{color:var(--danger);font-weight:800}.soon{color:var(--amber);font-weight:800}.delete{background:none;border:0;color:#777}.addBox{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:8px;margin-bottom:18px}.addBox input,.addBox select{background:#090b0a;border:1px solid #303432;color:white;padding:11px;border-radius:5px}
.security{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.security div{border:1px solid var(--line);padding:16px}.security b{display:block}.security span{font-size:11px;color:#777;line-height:1.5}
footer{border-top:1px solid var(--line);padding:45px 0;color:#777;font-size:12px;display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px}.footerLogo{color:white}
@media(max-width:800px){nav{display:none;position:absolute;top:78px;left:0;right:0;background:#0b0d0c;border-bottom:1px solid var(--line);padding:10px;flex-direction:column}nav.open{display:flex}nav button{width:100%}.hamb{display:block}.hero{grid-template-columns:1fr;padding-top:40px}.heroPhoto{height:350px}.heroCard{left:10px}.stats{grid-template-columns:repeat(2,1fr);gap:15px}.stats div{border:0;padding:0}.section{padding:65px 0}.sectionHead,.dashboardTop{display:block}.section h2{font-size:55px}.featureGrid,.gallery,.plans,.profileGrid,.supportGrid,.dashCards,.security{grid-template-columns:1fr}.cta{display:block}.cta h2{font-size:50px}.addBox{grid-template-columns:1fr}footer{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="container navrow"><div class="logo" onclick="render('home')"><i class="mark">M</i><span>MAC <em>FITNESS</em></span></div><nav id="nav"><button onclick="render('home')">Home</button><button onclick="render('members')">My Profile</button><button onclick="render('gallery')">Gallery</button><button onclick="render('plans')">Membership</button><button onclick="render('support')">Support</button><button class="adminBtn" onclick="render('admin')">Admin</button></nav><button class="hamb" onclick="document.getElementById('nav').classList.toggle('open')">☰</button></div></header>
<div id="app"></div>
<footer><div class="container" style="display:contents"><div><div class="logo footerLogo"><i class="mark">M</i><span>MAC <em>FITNESS</em></span></div><div>Train hard. Stay consistent. Become stronger.</div></div><div><b style="color:white">Quick Links</b><p onclick="render('gallery')">Gallery</p><p onclick="render('plans')">Membership</p></div><div><b style="color:white">Contact</b><p>+91 98765 43210</p><p>support@macfitness.in</p></div></div></footer>
<script>
const IMG=[
["Strength Zone","https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1200&q=85"],
["Free Weights","https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?auto=format&fit=crop&w=1200&q=85"],
["Training Floor","https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=1200&q=85"],
["Cardio","https://images.unsplash.com/photo-1576678927484-cc907957088c?auto=format&fit=crop&w=1200&q=85"],
["Leg Day","https://images.unsplash.com/photo-1596357395217-80de13130e92?auto=format&fit=crop&w=1200&q=85"],
["Heavy Lifting","https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?auto=format&fit=crop&w=1200&q=85"]];
let members=JSON.parse(localStorage.macFitnessMembers||'null')||[
{id:1,name:"Rahul Sharma",phone:"+91 98765 43210",plan:"Monthly",start:"2026-09-01",end:"2026-10-01",status:"Active"},
{id:2,name:"Amit Verma",phone:"+91 91234 56789",plan:"Yearly",start:"2026-01-12",end:"2027-01-12",status:"Active"},
{id:3,name:"Priya Singh",phone:"+91 99887 77665",plan:"Quarterly",start:"2026-06-15",end:"2026-09-15",status:"Expired"},
{id:4,name:"Arjun Patel",phone:"+91 90000 12345",plan:"Monthly",start:"2026-08-25",end:"2026-09-25",status:"Expiring Soon"}];
let profile=JSON.parse(localStorage.macFitnessProfile||'null')||{name:"Demo Member",email:"member@example.com",phone:"+91 90000 00000",plan:"Monthly",start:"2026-09-01",end:"2026-10-01",status:"Active"};
function persist(){localStorage.macFitnessMembers=JSON.stringify(members);localStorage.macFitnessProfile=JSON.stringify(profile)}
function closeNav(){document.getElementById('nav').classList.remove('open')}
function render(page){closeNav();const a=document.getElementById('app');if(page==='home')a.innerHTML=home();if(page==='members')a.innerHTML=member();if(page==='gallery')a.innerHTML=gallery();if(page==='plans')a.innerHTML=plans();if(page==='support')a.innerHTML=support();if(page==='admin')a.innerHTML=login();scrollTo(0,0)}
function home(){return `<div class="container"><section class="hero"><div><div class="eyebrow">MAC FITNESS • PREMIUM TRAINING</div><h1>BUILD THE<br><span>STRONGER YOU.</span></h1><p>Powerful training, premium equipment and a community that keeps you moving.</p><div class="actions"><button class="primary" onclick="render('plans')">View Memberships</button><button class="secondary" onclick="render('gallery')">Explore Gym</button></div></div><div class="heroPhoto"><img src="${IMG[0][1]}"><div class="heroCard">TRAIN DAILY<small>NO EXCUSES</small></div></div></section><div class="stats"><div><b>500+</b><small>Members</small></div><div><b>40+</b><small>Premium Machines</small></div><div><b>7 DAYS</b><small>Open Every Week</small></div><div><b>100%</b><small>Energy</small></div></div><section class="section"><div class="sectionHead"><div><div class="eyebrow">WHY MAC FITNESS</div><h2>EVERYTHING YOU NEED TO <span>LEVEL UP.</span></h2></div><button class="secondary" onclick="render('support')">Contact Support</button></div><div class="featureGrid">${[['Premium Equipment','Modern strength and cardio equipment maintained for serious training.'],['Expert Environment','A focused, clean and motivating space built around your goals.'],['Member First','Simple membership tracking and direct support whenever you need it.']].map((x,i)=>`<div class="feature"><div class="num">0${i+1}</div><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div></section><div class="cta"><div><div class="eyebrow">YOUR NEXT SET STARTS HERE</div><h2>READY TO GET <span>STRONGER?</span></h2></div><button class="primary" onclick="render('plans')">Join Mac Fitness</button></div></div>`}
function member(){return `<div class="container"><section class="section"><div class="eyebrow">MEMBER PORTAL</div><h2>MY <span>PROFILE</span></h2><div class="profileGrid"><div class="panel profile"><div class="avatar">${profile.name[0]||'M'}</div><h3>${profile.name}</h3><p>${profile.email}</p><div class="field"><label>Name</label><input value="${profile.name}" oninput="profile.name=this.value;persist()"></div><div class="field"><label>Email</label><input value="${profile.email}" oninput="profile.email=this.value;persist()"></div><div class="field"><label>Phone</label><input value="${profile.phone}" oninput="profile.phone=this.value;persist()"></div></div><div class="panel"><div class="eyebrow">MEMBERSHIP STATUS</div><h3 style="font-size:32px">${profile.plan} Plan</h3><div class="memberMeta"><div><span>Status</span><b class="active">${profile.status}</b></div><div><span>Valid Until</span><b>${profile.end}</b></div><div><span>Started</span><b>${profile.start}</b></div><div><span>Member ID</span><b>MF-${String(1042).padStart(5,'0')}</b></div></div><p style="margin-top:25px">Prototype note: this demo stores data in your browser only. Production version should use Supabase Auth + Row Level Security.</p></div></div></section></div>`}
function gallery(){return `<div class="container"><section class="section"><div class="eyebrow">THE MAC FITNESS FLOOR</div><h2>TRAIN IN A SPACE BUILT FOR <span>RESULTS.</span></h2><div class="gallery">${IMG.map(x=>`<div class="photo"><img src="${x[1]}"><div class="caption"><b>${x[0]}</b><small>MAC FITNESS</small></div></div>`).join('')}<div class="photo aiGif"><div class="orb"></div><div class="caption"><b>AI TRAINING LOOP</b><small>ANIMATED GYM ENERGY</small></div></div></div></section></div>`}
function plans(){return `<div class="container"><section class="section"><div class="eyebrow">MEMBERSHIP</div><h2>CHOOSE YOUR <span>PLAN.</span></h2><div class="plans">${[['Monthly','₹1,500','Flexible month-to-month'],['Quarterly','₹4,000','3 months of training'],['Yearly','₹12,000','Long-term membership']].map((x,i)=>`<div class="plan ${i===2?'featured':''}">${i===2?'<div class=badge>POPULAR</div>':''}<h3>${x[0]}</h3><div class="price">${x[1]} <small>/ plan</small></div><p>${x[2]}</p><ul><li>Full gym access</li><li>All equipment</li><li>Member support</li><li>Membership tracking</li></ul><button class="primary" onclick="alert('Selected ${x[0]} plan. Connect payment gateway for live enrollment.')">Select Plan</button></div>`).join('')}</div></section></div>`}
function support(){return `<div class="container"><section class="section supportGrid"><div><div class="eyebrow">CONTACT SUPPORT</div><h2>NEED HELP? <span>WE'RE HERE.</span></h2><p>Ask about memberships, timings, equipment or anything else.</p><div class="supportItem"><b>WhatsApp / Phone</b><span>+91 98765 43210</span></div><div class="supportItem"><b>Email</b><span>support@macfitness.in</span></div><div class="security"><div><b>Private</b><span>Member data should be protected by authentication and database policies.</span></div><div><b>Secure</b><span>Admin actions must be authorized server-side in production.</span></div><div><b>Protected</b><span>Never expose service-role keys or passwords in frontend code.</span></div></div></div><form class="panel" onsubmit="event.preventDefault();this.innerHTML='<h3 style=color:var(--lime)>Message received ✓</h3><p>Thank you. Support will contact you shortly.</p>'"><div class=field><label>Name</label><input required placeholder="Your name"></div><div class=field><label>Email</label><input required type=email placeholder="you@example.com"></div><div class=field><label>Message</label><textarea required placeholder="How can we help?"></textarea></div><button class=primary style="margin-top:20px">Send Message</button></form></section></div>`}
function login(){return `<div class="container login"><div class="panel loginBox"><div class="eyebrow">STAFF ACCESS</div><h2>ADMIN <span>LOGIN</span></h2><p>Prototype credentials: <b>admin</b> / <b>macfitness</b></p><form onsubmit="event.preventDefault();if(this.u.value==='admin'&&this.p.value==='macfitness')dashboard();else alert('Invalid credentials')"><input name=u autocomplete=username placeholder="Username" required><input name=p autocomplete=current-password type=password placeholder="Password" required><button class=primary>Secure Login</button></form><div class=notice><b>Security:</b> These are demo-only credentials. Do not deploy this client-side login to production. Use Supabase Auth and Row Level Security for real authentication and authorization.</div></div></div>`}
function dashboard(){document.getElementById('app').innerHTML=`<div class=container><section class=section><div class=dashboardTop><div><div class=eyebrow>CONTROL CENTER</div><h2>ADMIN <span>DASHBOARD</span></h2></div><button class=secondary onclick="render('home')">Exit</button></div><div class=dashCards><div class=metric><b>${members.length}</b><small>Total Members</small></div><div class="metric lime"><b>${members.filter(x=>x.status==='Active').length}</b><small>Active</small></div><div class=metric><b>${members.filter(x=>x.status==='Expiring Soon').length}</b><small>Expiring Soon</small></div><div class=metric><b>${members.filter(x=>x.status==='Expired').length}</b><small>Expired</small></div></div><div class=panel><div class=toolbar><input class=search id=q placeholder="Search name, phone or plan..." oninput=table()><button class=primary onclick=addMember()>+ Add Member</button></div><div id=t></div></div><div class=security><div><b>✓ Authorization</b><span>Production admin actions should be checked by database RLS policies, not only the UI.</span></div><div><b>✓ Secrets</b><span>No private API/service keys belong in this static frontend.</span></div><div><b>✓ Validation</b><span>Validate and sanitize all form input again on the server/database boundary.</span></div></div></section></div>`;table()}
function table(){let q=(document.getElementById('q')?.value||'').toLowerCase();let r=members.filter(m=>(m.name+m.phone+m.plan).toLowerCase().includes(q));document.getElementById('t').innerHTML=`<div class=tableWrap><table><tr><th>Member</th><th>Plan</th><th>Start</th><th>Expiry</th><th>Status</th><th>Action</th></tr>${r.map(m=>`<tr><td class=member><b>${m.name}</b><small>${m.phone}</small></td><td>${m.plan}</td><td>${m.start}</td><td>${m.end}</td><td class="${m.status==='Active'?'active':m.status==='Expired'?'expired':'soon'}">${m.status}</td><td><button class=delete onclick=removeMember(${m.id})>Delete</button></td></tr>`).join('')}</table></div>`}
function addMember(){let name=prompt('Member name');if(!name)return;let phone=prompt('Phone')||'';let plan=prompt('Plan: Monthly / Quarterly / Yearly','Monthly')||'Monthly';members.push({id:Date.now(),name,phone,plan,start:new Date().toISOString().slice(0,10),end:'2026-10-16',status:'Active'});persist();dashboard()}
function removeMember(id){if(confirm('Delete this demo member?')){members=members.filter(x=>x.id!==id);persist();table()}}
</script>
</body></html>
